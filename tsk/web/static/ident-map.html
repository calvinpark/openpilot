<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EPS Identity & Service Map</title>
    <style>
      * { box-sizing: border-box; margin: 0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
        background: #f2f2f7;
        color: #1c1c1e;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .page {
        width: min(100vw, 460px);
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 100vh;
      }

      .back-bar { padding: 12px 20px; }

      .back-link {
        color: #007aff;
        font-size: 17px;
        text-decoration: none;
        -webkit-tap-highlight-color: transparent;
      }

      .back-link::before { content: "‹ "; }

      .page-header { padding: 0 20px 12px; }

      .page-title { font-size: 24px; font-weight: 700; }

      .terminal {
        margin: 0 16px 16px;
        background: #1c1c1e;
        border-radius: 12px;
        padding: 16px;
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        font-family: "SF Mono", ui-monospace, monospace;
        font-size: 12px;
        line-height: 1.55;
        color: #e5e5ea;
        white-space: pre-wrap;
        word-break: break-all;
      }

      .terminal .err { color: #ff453a; }
      .terminal .ok { color: #30d158; }
      .terminal .warn { color: #ff9f0a; }
      .terminal .dim { color: #8e8e93; }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="back-bar">
        <a class="back-link" href="/">TSK Manager</a>
      </div>
      <header class="page-header">
        <div class="page-title">EPS Identity &amp; Service Map</div>
      </header>
      <div class="terminal" id="terminal"></div>
    </main>

    <script>
      const terminal = document.getElementById("terminal");

      function termWrite(text, className) {
        const span = document.createElement("span");
        if (className) span.className = className;
        span.textContent = text + "\n";
        terminal.appendChild(span);
        terminal.scrollTop = terminal.scrollHeight;
      }

      function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

      function pad(s, n) {
        s = String(s);
        return s.length >= n ? s : s + " ".repeat(n - s.length);
      }

      async function getStatus() {
        const r = await fetch("/api/ident-map-status", { cache: "no-store" });
        return r.json();
      }

      function epsBusLine(s) {
        if (s.eps_bus === undefined || s.eps_bus === -1) {
          termWrite("EPS bus: no response on 0/1/2", "err");
        } else {
          termWrite("EPS bus: " + s.eps_bus, s.eps_bus === 0 ? "" : "warn");
        }
      }

      function renderMap(s) {
        termWrite("");
        termWrite("EPS identity & service map", "ok");
        termWrite("Panda: " + (s.panda || "?"));
        epsBusLine(s);

        termWrite("");
        termWrite("Identity:");
        if (!(s.identity || []).length) termWrite("  (none read)", "dim");
        for (const it of (s.identity || [])) {
          const label = pad(it.did + " " + it.name, 24);
          if (it.hex) {
            termWrite("  " + label + ": " + it.ascii + "  [" + it.hex + "]");
          } else {
            termWrite("  " + label + ": " + it.ascii, "warn");
          }
        }

        termWrite("");
        termWrite("Services:");
        for (const sv of (s.services || [])) {
          let cls = "warn";
          if (sv.supported === true) cls = "ok";
          else if (sv.supported === false) cls = "err";
          termWrite("  " + pad(sv.name, 22) + " " + sv.detail, cls);
        }

        termWrite("");
        if (s.message) termWrite(s.message, "warn");
        termWrite("");
        termWrite("Screenshot ALL of this — scroll up for the full list — and send it to Calvin.", "dim");
      }

      async function runMap() {
        let s = null;
        try { s = await getStatus(); } catch (err) { /* fall through */ }

        if (s && s.status === "running") {
          termWrite("A map is already in progress — attaching...");
        } else {
          termWrite("Reading EPS identity and probing which UDS services answer.", "warn");
          termWrite("Read-only: no reset, no write, no key sent.", "dim");
          try {
            const r = await fetch("/api/ident-map", { method: "POST", cache: "no-store" });
            const started = await r.json();
            if (!started.ok && started.status !== "running") {
              termWrite(started.message || "Could not start the map.", "err");
              return;
            }
          } catch (err) {
            termWrite(String(err), "err");
            return;
          }
        }

        termWrite("Mapping...");
        let last = -1;
        while (true) {
          await sleep(500);
          try { s = await getStatus(); } catch (err) { continue; }
          if (s.status === "running") {
            if ((s.count || 0) !== last) {
              last = s.count || 0;
              termWrite("  " + last + (s.last ? "  " + s.last : ""));
            }
            continue;
          }
          if (s.status === "failed") {
            termWrite("");
            termWrite(s.message || "Map failed.", "err");
            break;
          }
          renderMap(s);
          break;
        }
      }

      runMap();
    </script>
  </body>
</html>
