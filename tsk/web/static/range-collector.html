<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Range Dump</title>
    <style>
      * { box-sizing: border-box; margin: 0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
        background: #f2f2f7;
        color: #1c1c1e;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .page {
        width: min(100vw, 460px);
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 100vh;
      }

      .back-bar {
        padding: 12px 20px;
      }

      .back-link {
        color: #007aff;
        font-size: 17px;
        text-decoration: none;
        -webkit-tap-highlight-color: transparent;
      }

      .back-link::before {
        content: "‹ ";
      }

      .page-header {
        padding: 0 20px 12px;
      }

      .page-title {
        font-size: 28px;
        font-weight: 700;
      }

      .page-sub {
        font-size: 13px;
        color: #8e8e93;
        margin-top: 4px;
      }

      .terminal {
        margin: 0 16px 16px;
        background: #1c1c1e;
        border-radius: 12px;
        padding: 16px;
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        font-family: "SF Mono", ui-monospace, monospace;
        font-size: 13px;
        line-height: 1.6;
        color: #e5e5ea;
        white-space: pre-wrap;
        word-break: break-all;
      }

      .terminal .err { color: #ff453a; }
      .terminal .ok { color: #30d158; }
      .terminal .warn { color: #ff9f0a; }
      .terminal .dim { color: #8e8e93; }

    </style>
  </head>
  <body>
    <main class="page">
      <div class="back-bar">
        <a class="back-link" href="/">TSK Manager</a>
      </div>
      <header class="page-header">
        <div class="page-title" id="title">Range Dump</div>
        <div class="page-sub" id="subtitle"></div>
      </header>
      <div class="terminal" id="terminal"></div>
    </main>

    <script>
      // Tap-to-run rather than auto-run: these ranges are unproven and each attempt
      // costs a Not Ready To Drive session, so arriving on the page must not fire one.
      const profile = new URLSearchParams(location.search).get("profile") || "";
      const terminal = document.getElementById("terminal");
      const titleEl = document.getElementById("title");
      const subEl = document.getElementById("subtitle");

      // Mirrors the two server-side gates. The page runs on entry, so this decides
      // whether it runs at all. The real gate is in tsk/lib immediately before the
      // SEND_KEY; this only keeps the page from firing a request that would be refused.
      const gate = { ran: false, blocked: false, reason: "" };

      function termWrite(text, className) {
        const span = document.createElement("span");
        if (className) span.className = className;
        span.textContent = text + "\n";
        terminal.appendChild(span);
        terminal.scrollTop = terminal.scrollHeight;
      }

      async function loadGate() {
        try {
          const response = await fetch("/api/preflight-status", { cache: "no-store" });
          const pf = await response.json();
          gate.ran = !!pf.has_run;
          gate.blocked = !!pf.blocked;
          gate.reason = gate.blocked
            ? "This ECU rejected a security key, so no more keys will be sent to it."
            : (gate.ran ? "" : "Run the preflight check from the main page first.");
        } catch (err) {
          // A status the page could not read is not a licence to send a key.
          gate.ran = false;
          gate.blocked = false;
          gate.reason = "Could not read the preflight status.";
        }
      }

      function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
      }

      function hex32(n) {
        return "0x" + (n >>> 0).toString(16).padStart(8, "0").toUpperCase();
      }

      async function getStatus() {
        const response = await fetch(
          "/api/range-status?profile=" + encodeURIComponent(profile), { cache: "no-store" });
        return response.json();
      }

      function progressBar(bytes, total) {
        const pct = total ? Math.round(bytes / total * 100) : 0;
        const filled = Math.max(0, Math.min(20, Math.round(pct / 5)));
        const bar = "█".repeat(filled) + "░".repeat(20 - filled);
        return `  [${bar}] ${bytes}/${total}`;
      }

      function writeOutcome(s) {
        termWrite("");
        if (s.status === "complete") {
          termWrite(s.message || "Dump complete.", "ok");
        } else if (s.status === "partial") {
          termWrite(s.message || "Partial dump saved.", "warn");
        } else if (s.status === "empty") {
          termWrite(s.message || "No frames received.", "err");
        } else {
          termWrite(s.message || "Dump failed.", "err");
        }
        writeOnDisk(s);
      }

      // Complete and partial listed under separate headings with their own counts, so
      // a gapped run is never read as progress toward a target of N complete dumps.
      function writeOnDisk(s) {
        const dumps = s.dumps || [];
        if (!dumps.length) return;
        const complete = dumps.filter(d => d.status === "complete");
        const partial = dumps.filter(d => d.status !== "complete");
        termWrite("");
        termWrite(`On disk: ${complete.length} complete, ${partial.length} partial`, "dim");
        for (const d of complete) {
          termWrite(`  ${d.name}  ${d.bytes} bytes`, "ok");
        }
        for (const d of partial) {
          termWrite(`  ${d.name}  ${d.bytes} bytes (gapped)`, "warn");
        }
      }

      async function runDump() {
        let s = null;
        try {
          s = await getStatus();
        } catch (err) { /* server not reachable yet, fall through to start */ }

        if (s && s.status === "running") {
          termWrite("A dump is already in progress — attaching...");
        } else {
          termWrite("Starting dump.");
          termWrite("The car will freak out - don't worry.", "warn");
          try {
            const response = await fetch("/api/range-dump", {
              method: "POST",
              cache: "no-store",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ profile: profile }),
            });
            const started = await response.json();
            if (!started.ok && started.status !== "running") {
              termWrite(started.message || "Could not start dump.", "err");
              return;
            }
          } catch (err) {
            termWrite(String(err), "err");
            return;
          }
        }

        let lastBytes = -1;
        while (true) {
          await sleep(500);
          try {
            s = await getStatus();
          } catch (err) {
            continue;  // transient poll failure, keep waiting
          }
          if (s.status === "running") {
            if (s.bytes !== lastBytes) {
              lastBytes = s.bytes;
              termWrite(progressBar(s.bytes, s.total || 0));
            }
            continue;
          }
          writeOutcome(s);
          break;
        }
      }

      async function init() {
        await loadGate();
        if (!profile) {
          termWrite("No profile given in the URL.", "err");
          return;
        }
        let s;
        try {
          s = await getStatus();
        } catch (err) {
          termWrite(String(err), "err");
          return;
        }
        if (!s || !s.profile) {
          termWrite(`Unknown profile: ${profile}`, "err");
          return;
        }
        titleEl.textContent = s.label;
        subEl.textContent = `${hex32(s.start)}-${hex32(s.end)}   ${s.total} bytes   ${Math.floor(s.total / 4)} frames`;
        document.title = s.label + " Dump";

        termWrite("Not Ready To Drive mode. Keep the comma powered.", "dim");
        termWrite("Cap: 25 minutes per run.", "dim");
        // Taken from the profile, not printed as one blanket claim: dataflash has run
        // on the car and returned a known answer, the other five have not.
        if (s.proven) {
          termWrite("This payload has run on the car and returned a known answer.", "ok");
        } else {
          termWrite("Unproven payload — a null result means unknown, not empty.", "warn");
        }
        writeOnDisk(s);

        // Runs on entry, so opening the row IS the tap. A run already in flight is
        // attached to instead of started again, and a gated car prints why and stops
        // here rather than firing a request the server would refuse.
        if (s.status === "running") {
          runDump();
          return;
        }
        if (gate.reason) {
          termWrite("");
          termWrite(gate.reason, "err");
          return;
        }
        runDump();
      }

      init();
    </script>
  </body>
</html>
