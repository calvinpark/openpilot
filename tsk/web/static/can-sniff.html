<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CAN Sniffer</title>
    <style>
      * { box-sizing: border-box; margin: 0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
        background: #f2f2f7;
        color: #1c1c1e;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .page {
        width: min(100vw, 460px);
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 100vh;
      }

      .back-bar {
        padding: 12px 20px;
      }

      .back-link {
        color: #007aff;
        font-size: 17px;
        text-decoration: none;
        -webkit-tap-highlight-color: transparent;
      }

      .back-link::before {
        content: "‹ ";
      }

      .page-header {
        padding: 0 20px 12px;
      }

      .page-title {
        font-size: 28px;
        font-weight: 700;
      }

      .terminal {
        margin: 0 16px 16px;
        background: #1c1c1e;
        border-radius: 12px;
        padding: 16px;
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        font-family: "SF Mono", ui-monospace, monospace;
        font-size: 13px;
        line-height: 1.6;
        color: #e5e5ea;
        white-space: pre-wrap;
        word-break: break-all;
      }

      .terminal .err { color: #ff453a; }
      .terminal .ok { color: #30d158; }
      .terminal .warn { color: #ff9f0a; }
      .terminal .dim { color: #8e8e93; }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="back-bar">
        <a class="back-link" href="/">TSK Manager</a>
      </div>
      <header class="page-header">
        <div class="page-title">CAN Sniffer</div>
      </header>
      <div class="terminal" id="terminal"></div>
    </main>

    <script>
      const terminal = document.getElementById("terminal");

      function termWrite(text, className) {
        const span = document.createElement("span");
        if (className) span.className = className;
        span.textContent = text + "\n";
        terminal.appendChild(span);
        terminal.scrollTop = terminal.scrollHeight;
      }

      function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
      }

      async function getStatus() {
        const response = await fetch("/api/can-sniff-status", { cache: "no-store" });
        return response.json();
      }

      function renderResult(s) {
        termWrite("");
        termWrite(`CAN sniff (${Math.round(s.seconds || 0)}s)`, "ok");
        for (const b of (s.buses || [])) {
          const label = `Bus ${b.bus}:`.padEnd(7);
          if (!b.total) {
            termWrite(`${label} 0 frames`, "dim");
          } else {
            let line = `${label} ${b.total} frames (${b.unique} IDs)`;
            if (b.max_len > 8) line += ` [CAN-FD ${b.max_len}B]`;
            if (b.ids && b.ids.length) line += " — " + b.ids.join(" ");
            if (b.truncated) line += " …";
            termWrite(line, b.max_len > 8 ? "warn" : undefined);
          }
        }
        if ((s.fd_buses || []).length) {
          termWrite("");
          termWrite("CAN-FD seen on bus " + s.fd_buses.join(", ") + " (frames > 8 bytes)", "warn");
        }
        termWrite("");
        termWrite("SecOC markers (any bus):");
        for (const m of (s.markers || [])) {
          const lbl = String(m.label).padEnd(9);
          if (m.buses && m.buses.length) {
            termWrite(`  ${lbl}: seen on bus ${m.buses.join(", ")}`, "ok");
          } else {
            termWrite(`  ${lbl}: not seen`, "warn");
          }
        }
        termWrite("");
        termWrite("Screenshot this and send it to Calvin.", "dim");
      }

      async function runSniff() {
        // Attach to an in-progress sniff, else start one. Each run overwrites the
        // last; there is no persisted file, so revisiting just re-sniffs.
        let s = null;
        try {
          s = await getStatus();
        } catch (err) { /* server not reachable yet, fall through to start */ }

        if (s && s.status === "running") {
          termWrite("A sniff is already in progress — attaching...");
        } else {
          termWrite("Starting CAN sniff (read-only, no messages sent).");
          try {
            const response = await fetch("/api/can-sniff", { method: "POST", cache: "no-store" });
            const started = await response.json();
            if (!started.ok && started.status !== "running") {
              termWrite(started.message || "Could not start sniff.", "err");
              return;
            }
          } catch (err) {
            termWrite(String(err), "err");
            return;
          }
        }

        termWrite("Listening on all buses for 8 seconds...");
        let lastSec = -1;
        while (true) {
          await sleep(500);
          try {
            s = await getStatus();
          } catch (err) {
            continue;  // transient poll failure, keep waiting
          }
          if (s.status === "running") {
            const sec = Math.round(s.seconds || 0);
            if (sec !== lastSec) {
              lastSec = sec;
              termWrite(`  ${sec}s   ${s.frames || 0} frames`);
            }
            continue;
          }
          if (s.status === "failed") {
            termWrite("");
            termWrite(s.message || "Sniff failed.", "err");
            break;
          }
          renderResult(s);
          break;
        }
      }

      runSniff();
    </script>
  </body>
</html>
