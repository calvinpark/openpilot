<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Programming Session Probe</title>
    <style>
      * { box-sizing: border-box; margin: 0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
        background: #f2f2f7;
        color: #1c1c1e;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .page {
        width: min(100vw, 460px);
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 100vh;
      }

      .back-bar { padding: 12px 20px; }

      .back-link {
        color: #007aff;
        font-size: 17px;
        text-decoration: none;
        -webkit-tap-highlight-color: transparent;
      }

      .back-link::before { content: "‹ "; }

      .page-header { padding: 0 20px 12px; }

      .page-title { font-size: 26px; font-weight: 700; }

      .terminal {
        margin: 0 16px 16px;
        background: #1c1c1e;
        border-radius: 12px;
        padding: 16px;
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        font-family: "SF Mono", ui-monospace, monospace;
        font-size: 12px;
        line-height: 1.55;
        color: #e5e5ea;
        white-space: pre-wrap;
        word-break: break-all;
      }

      .terminal .err { color: #ff453a; }
      .terminal .ok { color: #30d158; }
      .terminal .warn { color: #ff9f0a; }
      .terminal .dim { color: #8e8e93; }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="back-bar">
        <a class="back-link" href="/">TSK Manager</a>
      </div>
      <header class="page-header">
        <div class="page-title">Programming Session Probe</div>
      </header>
      <div class="terminal" id="terminal"></div>
    </main>

    <script>
      const terminal = document.getElementById("terminal");

      function termWrite(text, className) {
        const span = document.createElement("span");
        if (className) span.className = className;
        span.textContent = text + "\n";
        terminal.appendChild(span);
        terminal.scrollTop = terminal.scrollHeight;
      }

      function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

      async function getStatus() {
        const r = await fetch("/api/prog-probe-status", { cache: "no-store" });
        return r.json();
      }

      function renderProbe(s) {
        termWrite("");
        termWrite("Programming Session Probe", "ok");
        termWrite("Panda: " + (s.panda || "?"));
        if (s.eps_bus === undefined || s.eps_bus === -1) {
          termWrite("EPS bus: no response on 0/1/2", "err");
        } else {
          termWrite("EPS bus: " + s.eps_bus, s.eps_bus === 0 ? "" : "warn");
        }

        termWrite("");
        termWrite("Entry sequences:");
        for (const a of (s.attempts || [])) {
          const mark = a.ok ? "✓ " : "✗ ";
          termWrite("  " + mark + a.name, a.ok ? "ok" : "err");
          termWrite("      " + a.detail, a.ok ? "ok" : "dim");
        }

        const sec = s.security || {};
        if (sec.seed || sec.send_key) {
          termWrite("");
          termWrite("Security access:");
          termWrite("  seed     : " + (sec.seed || "-"));
          termWrite("  send_key : " + (sec.send_key || "-"), sec.send_key === "accepted" ? "ok" : "warn");
          if (sec.programming) termWrite("  programming after key : " + sec.programming);
        }

        termWrite("");
        if (s.message) termWrite(s.message, s.status === "entered" ? "ok" : "warn");
        termWrite("");
        termWrite("Screenshot ALL of this — scroll up for the full list — and send it to Calvin.", "dim");
      }

      async function runProbe() {
        let s = null;
        try { s = await getStatus(); } catch (err) { /* fall through */ }

        if (s && s.status === "running") {
          termWrite("A probe is already in progress — attaching...");
        } else {
          termWrite("Starting programming-session probe.");
          termWrite("The car will freak out — don't worry. This tries a few ways in; nothing is dumped.", "warn");
          try {
            const r = await fetch("/api/prog-probe", { method: "POST", cache: "no-store" });
            const started = await r.json();
            if (!started.ok && started.status !== "running") {
              termWrite(started.message || "Could not start the probe.", "err");
              return;
            }
          } catch (err) {
            termWrite(String(err), "err");
            return;
          }
        }

        termWrite("Trying entry sequences (this takes ~30s)...");
        let last = -1;
        while (true) {
          await sleep(500);
          try { s = await getStatus(); } catch (err) { continue; }
          if (s.status === "running") {
            if ((s.attempt_count || 0) !== last) {
              last = s.attempt_count || 0;
              termWrite("  sequence " + last + (s.last ? "  " + s.last : ""));
            }
            continue;
          }
          renderProbe(s);
          break;
        }
      }

      runProbe();
    </script>
  </body>
</html>
